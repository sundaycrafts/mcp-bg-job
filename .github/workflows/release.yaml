name: test-and-release

on:
    push:
        branches:
            - main
        tags:
            - "v*.*.*"
    pull_request:

permissions:
    contents: write

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version: "1.22"
                  cache: true

            - name: Test
              run: go test ./...

    release:
        needs: test
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest

        strategy:
            matrix:
                include:
                    - goos: linux
                      goarch: amd64
                      suffix: linux-amd64
                    - goos: linux
                      goarch: arm64
                      suffix: linux-arm64
                    - goos: darwin
                      goarch: amd64
                      suffix: darwin-amd64
                    - goos: darwin
                      goarch: arm64
                      suffix: darwin-arm64

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version: "1.22"
                  cache: true

            - name: Build
              env:
                  GOOS: ${{ matrix.goos }}
                  GOARCH: ${{ matrix.goarch }}
                  CGO_ENABLED: "0"
              run: |
                  mkdir -p dist
                  go build -trimpath -ldflags="-s -w" \
                    -o dist/mcp-bg-job-${{ matrix.suffix }} .

            - name: Upload artifact to GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  files: dist/mcp-bg-job-${{ matrix.suffix }}
